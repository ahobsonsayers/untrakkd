[project]
name = "untrakkd"
version = "0.1.0"
description = "Map any Untappd user's check-in history on an interactive map"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.128.0",
    "jinja2>=3.1.0",
    "pydantic>=2.12.5",
    "scrapling>=0.4.14",
    "curl-cffi>=0.16.1",
    "playwright>=1.62.0",
    "browserforge>=1.2.4",
    "typer>=0.19.0",
    "uvicorn>=0.35.0",
]

[project.scripts]
untrakkd = "untrakkd.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.11",
    "ty>=0.0.11",
]

[tool.ruff]
# https://docs.astral.sh/ruff/configuration/
line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/untrakkd"]
