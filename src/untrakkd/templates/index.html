<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untrakkd</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    :root {
      --bg: #0d0e12;
      --panel: #15171d;
      --card: #1a1d26;
      --card-hover: #21252f;
      --border: #2a2e3a;
      --accent: #f59000;
      --accent-glow: rgba(245, 144, 0, 0.35);
      --accent-soft: rgba(245, 144, 0, 0.12);
      --text: #e8e8ec;
      --text-dim: #8b8e9a;
      --text-mute: #5c5f6b;
    }
    html, body { margin: 0; height: 100%; font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
    body { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }
    #map { flex: 1; height: 100%; }
    #sidebar { width: 360px; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--border); }
    #header { padding: 20px 20px 12px; box-sizing: border-box; flex: none; background: linear-gradient(180deg, var(--card) 0%, var(--panel) 100%); border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.15rem; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.01em; }
    h1 .beer-emoji { filter: drop-shadow(0 0 6px var(--accent-glow)); }
    #count { font-size: 0.78rem; color: var(--text-dim); margin: 0; }
    #count .stat-num { color: var(--accent); font-weight: 600; }
    #timeline { flex: 1; overflow-y: auto; padding: 8px 12px 20px; -webkit-overflow-scrolling: touch; scroll-behavior: auto; }
    #timeline::-webkit-scrollbar { width: 6px; }
    #timeline::-webkit-scrollbar-track { background: transparent; }
    #timeline::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .event { border-left: 3px solid transparent; border-radius: 8px; margin: 4px 0; padding: 12px 14px; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; background: var(--card); }
    .event:hover { background: var(--card-hover); }
    .event.active { border-left-color: var(--accent); background: var(--card-hover); box-shadow: inset 0 0 20px var(--accent-soft); }
    .event:active { transform: scale(0.98); }
    .meta { font-size: 0.72rem; color: var(--text-mute); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
    .loc { color: var(--text); margin-bottom: 4px; line-height: 1.3; }
    .beer { font-weight: 600; margin-bottom: 2px; line-height: 1.3; }
    .brew { color: var(--text-dim); font-size: 0.85rem; line-height: 1.3; }
    .key { color: var(--text-mute); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 4px; font-weight: 600; }
    .rating-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
    .stars { color: var(--accent); letter-spacing: 2px; font-size: 0.9rem; text-shadow: 0 0 8px var(--accent-glow); }
    .stars .empty { color: var(--border); text-shadow: none; }
    .rating-num { font-size: 0.72rem; color: var(--text-dim); font-weight: 600; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .incomplete-notice { margin: 16px 12px; padding: 12px 14px; border-radius: 8px; background: rgba(245, 144, 0, 0.08); border: 1px solid rgba(245, 144, 0, 0.25); color: var(--text-dim); font-size: 0.78rem; line-height: 1.4; text-align: center; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
    .stat-card .stat-label { font-size: 0.65rem; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    .stat-card .stat-value { font-size: 0.85rem; color: var(--text); font-weight: 600; margin-top: 2px; }
    .stat-card .stat-value .accent { color: var(--accent); }
    /* Dark popups */
    .maplibregl-popup-content { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .maplibregl-popup-tip { border-top-color: var(--card) !important; border-bottom-color: var(--card) !important; }
    .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: var(--card) !important; }
    .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: var(--card) !important; }
    .maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: var(--card) !important; }
    .maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: var(--card) !important; }
    .maplibregl-popup-content strong { color: var(--accent); font-size: 1rem; }
    .maplibregl-popup-content .stars { color: var(--accent); }
    .maplibregl-popup-content .rating-num { color: var(--text-dim); }
    /* Mobile */
    @media (max-width: 700px) {
      body { flex-direction: column; }
      #map { height: 45%; flex: none; }
      #sidebar { width: 100%; height: 55%; border-left: none; border-top: 1px solid var(--border); }
      #header { padding: 12px 16px 8px; }
      #timeline { padding: 6px 10px 16px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="sidebar">
    <div id="header">
      <h1><span class="beer-emoji">🍺</span> Untrakkd</h1>
      <p id="count"></p>
      <div class="stats-grid" id="stats"></div>
    </div>
    <div id="timeline"></div>
  </div>
  <script>
    const EVENTS = {{ events | safe }};
    const PROFILE = {{ profile | safe }};
    const displayName = PROFILE.display_name || PROFILE.username || 'Unknown';

    function renderStars(rating) {
      if (rating == null || rating <= 0) return '';
      const full = Math.floor(rating);
      const roundUp = rating - full >= 0.75 ? 1 : 0;
      const filled = full + roundUp;
      let stars = '';
      for (let i = 0; i < 5; i++) {
        stars += i < filled ? '\u2605' : '<span class="empty">\u2606</span>';
      }
      return `<div class="rating-row"><span class="stars">${stars}</span><span class="rating-num">${rating.toFixed(2)}</span></div>`;
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, attribution: '\u00a9 OpenStreetMap contributors' }
        },
        layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
      },
      center: [0, 30],
      zoom: 1.5
    });

    const sorted = [...EVENTS].sort((a, b) => new Date(b.date) - new Date(a.date));
    const chrono = [...sorted].reverse();
    const withCoords = chrono.filter(e => e.lat != null && e.lng != null);
    const places = new Set(sorted.map(e => e.venue + '|' + e.lat + ',' + e.lng));

    // Key stats
    (function() {
      const rated = sorted.filter(e => e.rating != null && e.rating > 0);
      const avgRating = rated.length ? (rated.reduce((s, e) => s + e.rating, 0) / rated.length) : 0;

      const venueCount = {};
      const locCount = {};
      for (const e of sorted) {
        if (e.venue) venueCount[e.venue] = (venueCount[e.venue] || 0) + 1;
        const loc = e.city || 'Unknown';
        locCount[loc] = (locCount[loc] || 0) + 1;
      }
      const topVenue = Object.entries(venueCount).sort((a, b) => b[1] - a[1])[0] || ['\u2014', 0];
      const topLoc = Object.entries(locCount).sort((a, b) => b[1] - a[1])[0] || ['\u2014', 0];

      const dates = sorted.map(e => new Date(e.date));
      const spanDays = Math.max(1, (dates[0] - dates[dates.length - 1]) / 86400000);
      const perWeek = (sorted.length / (spanDays / 7));

      document.getElementById('stats').innerHTML =
        `<div class="stat-card"><div class="stat-label">Drinks / Week</div><div class="stat-value"><span class="accent">${perWeek.toFixed(1)}</span></div></div>` +
        `<div class="stat-card"><div class="stat-label">Avg Rating</div><div class="stat-value"><span class="accent">${avgRating.toFixed(2)}</span>\u2605</div></div>` +
        `<div class="stat-card"><div class="stat-label">Top Venue</div><div class="stat-value">${topVenue[0]} <span class="accent">(${topVenue[1]} check-ins)</span></div></div>` +
        `<div class="stat-card"><div class="stat-label">Top Location</div><div class="stat-value">${topLoc[0]} <span class="accent">(${topLoc[1]} check-ins)</span></div></div>`;
    })();

    map.on('load', () => {
      const features = withCoords.map((e, i) => ({
        type: 'Feature',
        properties: { idx: i, venue: e.venue || 'Unknown', beer: e.beer, brewery: e.brewery, city: e.city, date: e.date, rating: e.rating },
        geometry: { type: 'Point', coordinates: [e.lng, e.lat] }
      }));
      map.addSource('checkins', { type: 'geojson', data: { type: 'FeatureCollection', features } });

      // Dotted lines between consecutive checkins
      const lineFeatures = [];
      for (let i = 1; i < withCoords.length; i++) {
        const a = withCoords[i - 1], b = withCoords[i];
        lineFeatures.push({
          type: 'Feature',
          properties: {},
          geometry: { type: 'LineString', coordinates: [[a.lng, a.lat], [b.lng, b.lat]] }
        });
      }
      map.addSource('routes', { type: 'geojson', data: { type: 'FeatureCollection', features: lineFeatures } });
      map.addLayer({
        id: 'route-line', type: 'line', source: 'routes',
        layout: { 'line-cap': 'round' },
        paint: { 'line-color': '#4b4b4b', 'line-width': ['interpolate', ['linear'], ['zoom'], 0, 2, 10, 5, 15, 6], 'line-dasharray': [0, 2], 'line-opacity': 1 }
      });

      // Glow halo under pins
      map.addLayer({
        id: 'pin-glow', type: 'circle', source: 'checkins',
        paint: { 'circle-radius': 16, 'circle-color': '#4b4b4b', 'circle-opacity': 0.15, 'circle-blur': 1 }
      });
      map.addLayer({
        id: 'pins', type: 'circle', source: 'checkins',
        paint: { 'circle-radius': 6, 'circle-color': '#4b4b4b', 'circle-stroke-color': '#000', 'circle-stroke-width': 1 }
      });
      map.addLayer({
        id: 'active-pin', type: 'circle', source: 'checkins',
        filter: ['==', ['get', 'idx'], -1],
        paint: { 'circle-radius': 10, 'circle-color': '#22c55e', 'circle-stroke-color': '#000', 'circle-stroke-width': 1.5, 'circle-blur': 0.2 }
      });
    });

    map.on('click', 'pins', (e) => {
      const p = e.features[0].properties;
      const ev = withCoords[Number(p.idx)];
      const item = items.find(it => it.e === ev);
      if (item) {
        setActive(item.div);
        highlightPin(ev);
        suppressScrollFly = true;
        item.div.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => { suppressScrollFly = false; lastKey = ev.lat + ',' + ev.lng; }, 800);
      }
      const r = p.rating != null && p.rating > 0 ? `<br>${renderStars(parseFloat(p.rating))}` : '';
      new maplibregl.Popup({ offset: 14 }).setLngLat(e.lngLat)
        .setHTML(`<strong>${p.venue}</strong><br>${p.beer} by ${p.brewery}${r}<br>${p.city ? p.city + '<br>' : ''}${formatDate(p.date)}`)
        .addTo(map);
    });

    map.on('mouseenter', 'pins', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'pins', () => map.getCanvas().style.cursor = '');

    // Timeline
    const tl = document.getElementById('timeline');
    document.getElementById('count').innerHTML = `<span class="stat-num">${EVENTS.length}</span> check-ins by ${displayName} across <span class="stat-num">${places.size}</span> places`;
    const items = [];
    for (const e of sorted) {
      const div = document.createElement('div');
      div.className = 'event';
      const loc = e.city || 'Somewhere';
      div.innerHTML = `<div class="meta">${formatDate(e.date)}</div>
        <div class="loc"><span class="key">Location</span>${loc}</div>
        <div class="beer"><span class="key">Drink</span>${e.beer}</div>
        <div class="brew"><span class="key">Venue</span>${e.venue || '\u2014'}</div>
        ${renderStars(e.rating)}`;
      if (e.lat != null && e.lng != null) {
        div.onclick = () => flyToVenue(e, div);
      }
      items.push({ div, e });
      tl.appendChild(div);
    }

    if (PROFILE.history_incomplete) {
      const notice = document.createElement('div');
      notice.className = 'incomplete-notice';
      notice.textContent = 'Full check-in history could not be fetched';
      tl.appendChild(notice);
    }

    // Shared popup
    let popup = null;
    function flyToVenue(e, el) {
      map.flyTo({ center: [e.lng, e.lat], zoom: 13, speed: 1.8, curve: 1.2, duration: 2500 });
      setActive(el);
      highlightPin(e);
      if (popup) popup.remove();
      const r = e.rating != null && e.rating > 0 ? `<br>${renderStars(e.rating)}` : '';
      popup = new maplibregl.Popup({ closeButton: false, offset: 14 })
        .setLngLat([e.lng, e.lat])
        .setHTML(`<strong>${e.venue || e.city || 'Somewhere'}</strong><br>${e.beer} by ${e.brewery}${r}<br>${formatDate(e.date)}`)
        .addTo(map);
    }

    let activeEl = null;
    let activeIdx = -1;
    function setActive(el) {
      if (activeEl) activeEl.classList.remove('active');
      activeEl = el;
      if (el) el.classList.add('active');
    }
    function highlightPin(e) {
      const idx = withCoords.indexOf(e);
      if (idx === activeIdx) return;
      activeIdx = idx;
      if (map.getLayer('active-pin')) {
        map.setFilter('active-pin', ['==', ['get', 'idx'], idx]);
        if (idx >= 0) map.moveLayer('active-pin', null);
      }
    }

    // Scrubbing: as you scroll the timeline, follow him place to place.
    let lastKey = null;
    let suppressScrollFly = false;
    tl.addEventListener('scroll', () => {
      const mid = tl.scrollTop + tl.clientHeight * 0.4;
      let current = null;
      for (const item of items) {
        if (item.div.offsetTop <= mid) current = item;
        else break;
      }
      if (current) {
        const key = current.e.lat + ',' + current.e.lng;
        setActive(current.div);
        highlightPin(current.e);
        if (key !== lastKey && current.e.lat != null && current.e.lng != null && !suppressScrollFly) {
          lastKey = key;
          map.flyTo({ center: [current.e.lng, current.e.lat], zoom: 13, speed: 1.8, curve: 1.2, duration: 2500 });
        }
      }
    });
  </script>
</body>
</html>
