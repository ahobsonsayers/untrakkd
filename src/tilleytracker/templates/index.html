<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>***'s beer world tour</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #111; color: #eee; }
    body { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }
    #map { flex: 1; height: 100%; }
    #sidebar { width: 340px; display: flex; flex-direction: column; background: #111; }
    #header { padding: 16px 16px 8px; box-sizing: border-box; flex: none; }
    h1 { font-size: 1.2rem; margin: 0 0 4px; }
    #count { font-size: 0.8rem; color: #aaa; margin: 0; }
    h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .08em; color: #999; margin: 12px 0 0; }
    #timeline { flex: 1; overflow-y: auto; padding: 0 16px 16px; -webkit-overflow-scrolling: touch; scroll-behavior: auto; }
    .event { border-left: 3px solid transparent; border-bottom: 1px solid #2a2a2a; padding: 10px 8px; cursor: pointer; transition: background .15s, border-color .15s; }
    .event:hover { background: #1c1c1c; }
    .event.active { background: #1c1c1c; border-left-color: #e65100; }
    .beer { font-weight: 600; }
    .meta { font-size: 0.8rem; color: #aaa; }
    .badge { display: inline-block; margin-top: 6px; font-size: 0.7rem; color: #e65100; }
    .stars { color: #e65100; letter-spacing: 1px; font-size: 0.85rem; }
    .stars .empty { color: #444; }
    .rating-num { font-size: 0.75rem; color: #aaa; }
    /* Dark popups */
    .maplibregl-popup-content { background: #1c1c1c; color: #eee; border: 1px solid #3a3a3a; }
    .maplibregl-popup-tip { border-top-color: #1c1c1c; border-bottom-color: #1c1c1c; }
    .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: #1c1c1c; }
    .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: #1c1c1c; }
    .maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: #1c1c1c; }
    .maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: #1c1c1c; }
    .maplibregl-popup-content strong { color: #e65100; }
    .maplibregl-popup-content .stars { color: #e65100; }
    .maplibregl-popup-content .rating-num { color: #aaa; }
    /* Mobile: map on top, timeline scrolls below it */
    @media (max-width: 700px) {
      body { flex-direction: column; }
      #map { height: 45%; flex: none; }
      #sidebar { width: 100%; height: 55%; }
      #header { padding: 10px 12px 6px; }
      #timeline { padding: 0 12px 12px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="sidebar">
    <div id="header">
      <h1>🍺 ***'s beer world tour</h1>
      <p id="count"></p>
      <h2>Timeline</h2>
    </div>
    <div id="timeline"></div>
  </div>
  <script>
    const EVENTS = {{ events | safe }};

    function renderStars(rating) {
      if (rating == null || rating <= 0) return '';
      const full = Math.floor(rating);
      const half = rating - full >= 0.25 && rating - full < 0.75 ? 1 : 0;
      const roundUp = rating - full >= 0.75 ? 1 : 0;
      const filled = full + roundUp;
      const total = 5;
      let stars = '';
      for (let i = 0; i < total; i++) {
        stars += i < filled ? '\u2605' : '<span class="empty">\u2606</span>';
      }
      return `<span class="stars">${stars}</span> <span class="rating-num">${rating.toFixed(2)}</span>`;
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, attribution: '© OpenStreetMap contributors' }
        },
        layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
      },
      center: [0, 30],
      zoom: 1.5
    });

    const sorted = [...EVENTS].sort((a, b) => new Date(a.date) - new Date(b.date));
    const withCoords = sorted.filter(e => e.lat != null && e.lng != null);
    const places = new Set(sorted.map(e => e.venue + '|' + e.lat + ',' + e.lng));

    map.on('load', () => {
      const features = withCoords.map(e => ({
        type: 'Feature',
        properties: { venue: e.venue || 'Unknown', beer: e.beer, brewery: e.brewery, city: e.city, date: e.date, rating: e.rating },
        geometry: { type: 'Point', coordinates: [e.lng, e.lat] }
      }));
      map.addSource('checkins', { type: 'geojson', data: { type: 'FeatureCollection', features } });

      // Dotted lines between consecutive checkins
      const lineFeatures = [];
      for (let i = 1; i < withCoords.length; i++) {
        const a = withCoords[i - 1], b = withCoords[i];
        lineFeatures.push({
          type: 'Feature',
          properties: {},
          geometry: { type: 'LineString', coordinates: [[a.lng, a.lat], [b.lng, b.lat]] }
        });
      }
      map.addSource('routes', { type: 'geojson', data: { type: 'FeatureCollection', features: lineFeatures } });
      map.addLayer({
        id: 'route-line', type: 'line', source: 'routes',
        layout: { 'line-cap': 'round' },
        paint: { 'line-color': '#e65100', 'line-width': 2, 'line-dasharray': [0, 4] }
      });

      // Chevron at midpoint of each segment
      const chevronFeatures = lineFeatures.map(f => {
        const [a, b] = f.geometry.coordinates;
        const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
        const bearing = Math.atan2(b[0] - a[0], b[1] - a[1]) * 180 / Math.PI;
        return { type: 'Feature', properties: { bearing: bearing - 90 }, geometry: { type: 'Point', coordinates: [mx, my] } };
      });
      map.addSource('chevrons', { type: 'geojson', data: { type: 'FeatureCollection', features: chevronFeatures } });
      map.addLayer({
        id: 'chevrons', type: 'symbol', source: 'chevrons',
        layout: { 'text-field': '\u27A4', 'text-size': 14, 'text-rotate': ['get', 'bearing'], 'text-rotate-alignment': 'map', 'text-allow-overlap': true },
        paint: { 'text-color': '#e65100' }
      });

      map.addLayer({
        id: 'pins', type: 'circle', source: 'checkins',
        paint: { 'circle-radius': 7, 'circle-color': '#e65100', 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 }
      });
    });

    map.on('click', 'pins', (e) => {
      const p = e.features[0].properties;
      const r = p.rating != null && p.rating > 0 ? `<br>${renderStars(parseFloat(p.rating))}` : '';
      new maplibregl.Popup().setLngLat(e.lngLat)
        .setHTML(`<strong>${p.venue}</strong><br>${p.beer} by ${p.brewery}${r}<br>${p.city ? p.city + '<br>' : ''}${p.date}`)
        .addTo(map);
    });

    map.on('mouseenter', 'pins', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'pins', () => map.getCanvas().style.cursor = '');

    // Timeline
    const tl = document.getElementById('timeline');
    document.getElementById('count').textContent = `${EVENTS.length} checkins across ${places.size} places`;
    const items = [];
    for (const e of sorted) {
      const d = new Date(e.date);
      const div = document.createElement('div');
      div.className = 'event';
      const place = e.venue || (e.city ? e.city : 'Somewhere');
      div.innerHTML = `<div class="beer">${e.beer}</div>
        <div class="brew">by ${e.brewery}</div>
        ${renderStars(e.rating)}
        <div class="brew">${e.venue || '—'}</div>
        <div class="meta">${d.toLocaleDateString()} ${e.city || ''}</div>
        ${e.lat != null && e.lng != null ? `<span class="badge">\ud83d\udccd ${place}</span>` : ''}`;
      if (e.lat != null && e.lng != null) {
        div.onclick = () => flyToVenue(e, div);
      }
      items.push({ div, e });
      tl.appendChild(div);
    }

    // Shared popup
    let popup = null;
    function flyToVenue(e, el) {
      map.flyTo({ center: [e.lng, e.lat], zoom: 10 });
      setActive(el);
      if (popup) popup.remove();
      const r = e.rating != null && e.rating > 0 ? `<br>${renderStars(e.rating)}` : '';
      popup = new maplibregl.Popup({ closeButton: false, offset: 12 })
        .setLngLat([e.lng, e.lat])
        .setHTML(`<strong>${e.venue || e.city || 'Somewhere'}</strong><br>${e.beer} by ${e.brewery}${r}<br>${e.date}`)
        .addTo(map);
    }

    let activeEl = null;
    function setActive(el) {
      if (activeEl) activeEl.classList.remove('active');
      activeEl = el;
      if (el) el.classList.add('active');
    }

    // Scrubbing: as you scroll the timeline, follow him place to place.
    let lastKey = null;
    tl.addEventListener('scroll', () => {
      const mid = tl.scrollTop + tl.clientHeight * 0.4;
      let current = null;
      for (const item of items) {
        if (item.div.offsetTop <= mid) current = item;
        else break;
      }
      if (current) {
        const key = current.e.lat + ',' + current.e.lng;
        setActive(current.div);
        if (key !== lastKey && current.e.lat != null && current.e.lng != null) {
          lastKey = key;
          map.flyTo({ center: [current.e.lng, current.e.lat], zoom: 9 });
        }
      }
    });
  </script>
</body>
</html>
